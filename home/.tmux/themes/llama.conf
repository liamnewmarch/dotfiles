# Theme: Llama
# Author: Liam Newmarch

# Palette
set -g @llama-black "#000000"
set -g @llama-dark-grey "#111111"
set -g @llama-grey "#29292a"
set -g @llama-mid-grey "#444444"
set -g @llama-light-grey "#f2f2f2"
set -g @llama-white "#ffffff"
set -g @llama-blue "#7caff8"
set -g @llama-magenta "#ed7db2"
set -g @llama-cyan "#75f8dc"

# Dark theme
set -gq dark-theme-black "#{@llama-black}"
set -gq dark-theme-dark-grey "#{@llama-dark-grey}"
set -gq dark-theme-light-grey "#{@llama-light-grey}"
set -gq dark-theme-white "#{@llama-white}"
set -gq dark-theme-blue "#{@llama-blue}"
set -gq dark-theme-magenta "#{@llama-magenta}"
set -gq dark-theme-cyan "#{@llama-cyan}"

# Light theme
set -gq light-theme-black "#{@llama-black}"
set -gq light-theme-dark-grey "#{@llama-dark-grey}"
set -gq light-theme-light-grey "#{@llama-light-grey}"
set -gq light-theme-white "#{@llama-white}"
set -gq light-theme-blue "#{@llama-blue}"
set -gq light-theme-magenta "#{@llama-magenta}"
set -gq light-theme-cyan "#{@llama-cyan}"

# Status bar
set -g status-style "bg=#{@llama-dark-grey},fg=#{@llama-white}"
set -g status-justify centre
set -g status-left-length 40
set -g status-left "#[fg=#{@llama-black},bg=#{@llama-magenta},bold] #{?HOST_NICKNAME,#{HOST_NICKNAME},#H} #[default] #[bg=#{@llama-blue},fg=#{@llama-black},bold] #(whoami) #[default] #{?client_prefix,↗, }"
set -g status-right-length 60
set -g status-right "%a %d %b %H:%M"

# Windows
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#{@llama-black},bg=#{@llama-blue},bold] #I:#W #[fg=#{@llama-light-grey},bg=#{@llama-dark-grey},nobold]"
setw -g window-status-current-style default
setw -g window-status-activity-style "fg=#{@llama-blue},bg=#{@llama-dark-grey}"

# Panes
set -g pane-border-style "fg=#{@llama-grey}"
set -g pane-active-border-style "fg=#{@llama-blue}"

# Messages
set -g message-style "fg=#{@llama-light-grey},bg=#{@llama-black},fill=#{@llama-black}"
set -g message-command-style "fg=#{@llama-light-grey},bg=#{@llama-black},fill=#{@llama-black}"

# Menu
set -g menu-style "fg=#{@llama-light-grey},bg=#{@llama-dark-grey}"
set -g menu-selected-style "fg=#{@llama-black},bg=#{@llama-blue}"
set -g menu-border-style "fg=#{@llama-dark-grey},bg=#{@llama-dark-grey}"
set -g menu-border-lines none
set -g mode-style "fg=#{@llama-black},bg=#{@llama-blue}"

# Tree mode (session picker); tmux < 3.8 doesn’t support these options, so guard with -q
setw -gq tree-mode-border-style "fg=#{@llama-mid-grey},bg=default"
setw -gq tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#{@llama-blue},#{@llama-white}}"

# Clock
setw -g clock-mode-colour "#{@llama-white}"
setw -g clock-mode-style 24
