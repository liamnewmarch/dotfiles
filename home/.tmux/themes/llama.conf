# Theme: Llama
# Author: Liam Newmarch

# Palette
set -g @llama-black "#000000"
set -g @llama-dark-grey "#111111"
set -g @llama-grey "#29292a"
set -g @llama-light-grey "#f2f2f2"
set -g @llama-white "#ffffff"
set -g @llama-blue "#7caff8"
set -g @llama-cyan "#75f8dc"

# Dark theme
set -gq dark-theme-black "#{@llama-black}"
set -gq dark-theme-dark-grey "#{@llama-dark-grey}"
set -gq dark-theme-light-grey "#{@llama-light-grey}"
set -gq dark-theme-white "#{@llama-white}"
set -gq dark-theme-blue "#{@llama-blue}"
set -gq dark-theme-cyan "#{@llama-cyan}"

# Light theme
set -gq light-theme-black "#{@llama-black}"
set -gq light-theme-dark-grey "#{@llama-dark-grey}"
set -gq light-theme-light-grey "#{@llama-light-grey}"
set -gq light-theme-white "#{@llama-white}"
set -gq light-theme-blue "#{@llama-blue}"
set -gq light-theme-cyan "#{@llama-cyan}"

# Status bar
set -g status-style "bg=#{@llama-dark-grey},fg=#{@llama-light-grey}"
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[fg=#000000,bg=#ffffff,bold] #S #[fg=#f2f2f2,bg=#111111,nobold] #(whoami) #I:#P "
set -g status-right "#[fg=#f2f2f2,bg=#111111]%a %d %b %H:%M | #{?HOST_NICKNAME,#{HOST_NICKNAME},#H} "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#000000,bg=#7caff8,bold] #I:#W #[fg=#f2f2f2,bg=#111111,nobold]"
setw -g window-status-activity-style "fg=#7caff8,bg=#111111"

set -g pane-border-style "fg=#29292a"
set -g pane-active-border-style "fg=#7caff8"

set -g message-style "fg=#f2f2f2,bg=#000000,fill=#000000"
set -g message-command-style "fg=#f2f2f2,bg=#000000,fill=#000000"
set -g menu-style "fg=#f2f2f2,bg=#111111"
set -g menu-selected-style "fg=#000000,bg=#7caff8"
set -g menu-border-style "fg=#111111,bg=#111111"
set -g menu-border-lines none
set -g mode-style "fg=#000000,bg=#7caff8"

setw -g clock-mode-colour "#7caff8"
setw -g clock-mode-style 24
